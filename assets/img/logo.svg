<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="maderaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5a2b" />
      <stop offset="50%" stop-color="#5c3a21" />
      <stop offset="100%" stop-color="#331f13" />
    </linearGradient>
    <linearGradient id="oroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <!-- Base circular con textura de anillo de madera -->
  <circle cx="50" cy="50" r="46" fill="url(#maderaGrad)" stroke="#c68a4c" stroke-width="3" />
  <circle cx="50" cy="50" r="39" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="6,4" />
  <!-- Silueta estilizada de mueble artesanal / ensamble de madera -->
  <path d="M26 36 L74 36 L70 44 L30 44 Z" fill="#f4ece4" />
  <rect x="30" y="44" width="40" height="18" rx="2" fill="#c68a4c" />
  <line x1="50" y1="44" x2="50" y2="62" stroke="#331f13" stroke-width="2" />
  <circle cx="42" cy="53" r="2" fill="#331f13" />
  <circle cx="58" cy="53" r="2" fill="#331f13" />
  <!-- Patas cónicas de madera -->
  <polygon points="32,62 30,76 34,76 35,62" fill="#f4ece4" />
  <polygon points="68,62 70,76 66,76 65,62" fill="#f4ece4" />
  <!-- Viruta / hoja artesanal superior -->
  <path d="M50 20 C42 26, 42 32, 50 32 C58 32, 58 26, 50 20 Z" fill="url(#oroGrad)" />
</svg>

