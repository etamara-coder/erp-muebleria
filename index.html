<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema · Mueblería Artesanal</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Estilos específicos de la pantalla de login */
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at 50% 20%, #f4ece4 0%, #ebe1d5 100%);
    }

    .login-card {
      background-color: var(--bg-card);
      width: 100%;
      max-width: 440px;
      border-radius: var(--radio-lg);
      border: 1px solid var(--borde-suave);
      box-shadow: var(--sombra-lg);
      overflow: hidden;
      border-top: 6px solid var(--madera-media);
    }

    .login-header {
      padding: 32px 28px 20px;
      text-align: center;
      background: linear-gradient(180deg, #ffffff 0%, var(--bg-principal) 100%);
      border-bottom: 1px solid var(--borde-suave);
    }

    .login-logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 12px;
      display: block;
    }

    .login-title {
      font-size: 1.4rem;
      color: var(--madera-oscura);
      margin-bottom: 4px;
    }

    .login-subtitle {
      font-size: 0.875rem;
      color: var(--texto-secundario);
    }

    .login-body {
      padding: 28px;
    }

    .login-error[hidden] {
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <img src="assets/img/logo.svg" alt="Logotipo Mueblería" class="login-logo">
        <h1 class="login-title">Mueblería Artesanal</h1>
        <p class="login-subtitle">Sistema de Gestión de Taller y Sucursales</p>
      </div>

      <div class="login-body">
        <div
          id="login-error"
          class="alerta alerta-error login-error"
          role="alert"
          aria-live="assertive"
          hidden
        ></div>

        <form id="form-login">
          <div class="form-group">
            <label for="email" class="form-label">Correo Electrónico</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="form-input" 
              placeholder="tu-correo@muebleria.com" 
              required
              autocomplete="email"
            >
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Contraseña</label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-input" 
              placeholder="••••••••" 
              required
              autocomplete="current-password"
            >
          </div>

          <button type="submit" id="btn-login" class="btn btn-primary btn-lg btn-block mt-3">
            Iniciar Sesión
          </button>
        </form>

        <div class="alerta alerta-info mt-3" style="font-size: 0.8125rem;">
          <span>🔒 <strong>Acceso protegido:</strong> El registro público está deshabilitado. Las cuentas son creadas por la administración.</span>
        </div>

      </div>
    </div>
  </div>

  <script type="module">
    import {
      signInWithPassword,
      verificarSesionActiva,
      redirigirSegunRol
    } from './js/auth.js';

    const formLogin = document.getElementById('form-login');
    const errorBox = document.getElementById('login-error');
    const btnLogin = document.getElementById('btn-login');

    function mostrarError(mensaje) {
      errorBox.textContent = mensaje;
      errorBox.hidden = false;
    }

    function ocultarError() {
      errorBox.textContent = '';
      errorBox.hidden = true;
    }

    // Si ya hay una sesión activa, evitamos mostrar el formulario de login.
    verificarSesionActiva()
      .then((perfil) => {
        if (perfil) {
          redirigirSegunRol(perfil);
        }
      })
      .catch((error) => {
        console.error('No se pudo comprobar la sesión:', error.message);
      });

    formLogin.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      ocultarError();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      btnLogin.disabled = true;
      btnLogin.textContent = 'Ingresando…';

      try {
        const perfil = await signInWithPassword(email, password);
        redirigirSegunRol(perfil);
      } catch (error) {
        mostrarError(error.message || 'No se pudo iniciar sesión. Intenta de nuevo.');
        btnLogin.disabled = false;
        btnLogin.textContent = 'Iniciar Sesión';
      }
    });
  </script>
</body>
</html>
